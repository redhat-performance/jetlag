---
# sync-acm-d tasks

- name: Create directories for syncing acm
  file:
    path: "{{ item }}"
    state: directory
  loop:
  - "{{ sync_path }}"
  - "{{ sync_path }}/acm"

- name: Template out pull-secret
  copy:
    content: "{{ acm_d_pull_secret }}"
    dest: "{{ sync_path }}/pull-secret.acm-d.txt"

- name: Add bastion registry to pull-secret
  shell: |
    b64auth=$( echo -n '{{ registry_user }}:{{ registry_password }}' | openssl base64 )
    AUTHSTRING="{\"{{ registry_host }}:{{ registry_port }}\": {\"auth\": \"$b64auth\",\"email\": \"openshift@redhat.com\" }}"
    jq -c ".auths += $AUTHSTRING" < {{ sync_path }}/pull-secret.acm-d.txt > {{ sync_path }}/pull-secret-bastion.acm-d.txt


- name: Mirror ACM/MCE from konflux build
  when: is_konflux_build or is_art_build
  block:
  - name: Add or update a block of acm/mce in registries.conf for downstream build
    when: is_konflux_build
    blockinfile:
      path: /etc/containers/registries.conf
      block: |
        [[registry]]
        location="registry.redhat.io/multicluster-engine"
        [[registry.mirror]]
        location="quay.io:443/acm-d"
        mirror-by-digest-only = false
        pull-from-mirror = "all"

        [[registry]]
        location="registry.redhat.io/rhacm2"
        [[registry.mirror]]
        location="quay.io:443/acm-d"
        mirror-by-digest-only = false
        pull-from-mirror = "all"

        # Work around for ACM-24931
        # [[registry]]
        # location="registry.redhat.io/openshift4"
        # [[registry.mirror]]
        # location="quay.io:443/acm-d"
        # mirror-by-digest-only = false
        # pull-from-mirror = "all"
      marker_begin: "<!-- Ansible ACM Begin -->"
      marker_end: "<!-- Ansible ACM End -->"

  - name: Add or update a block of acm/mce in registries.conf for ART build on stage
    when: is_art_build
    blockinfile:
      path: /etc/containers/registries.conf
      block: |
        [[registry]]
        location="registry.redhat.io/multicluster-engine"
        [[registry.mirror]]
        location="registry.stage.redhat.io/multicluster-engine"
        mirror-by-digest-only = false
        pull-from-mirror = "all"

        [[registry]]
        location="registry.redhat.io/rhacm2"
        [[registry.mirror]]
        location="registry.stage.redhat.io/rhacm2"
        mirror-by-digest-only = false
        pull-from-mirror = "all"
      marker_begin: "<!-- Ansible sync ACM ART Begin -->"
      marker_end: "<!-- Ansible sync ACM ART End -->"

  - name: Create ImageSetConfiguration for downstream build
    when: is_konflux_build
    template:
      src: imagesetconf.yml.j2
      dest: "{{ sync_path }}/acm/imagesetconf.yml"

  - name: Create ImageSetConfiguration for ART build on stage
    when: is_art_build
    template:
      src: imagesetconf_art.yml.j2
      dest: "{{ sync_path }}/acm/imagesetconf.yml"

  - name: Mirror acm images onto the bastion registry
    shell: |
      oc mirror --authfile {{ sync_path }}/pull-secret-bastion.acm-d.txt  -c {{ sync_path }}/acm/imagesetconf.yml --workspace file://{{ sync_path }}/acm/ docker://{{ registry_host }}:{{ registry_port }} --v2
    register: result
    until: not result.failed
    retries: 3
    delay: 1

- name: Mirror ztp-site-generator image
  shell: |
    oc image mirror -a {{ sync_path }}/pull-secret-bastion.acm-d.txt {{ ztp_site_generator_image }}:{{ ztp_site_generator_image_tag }} {{ registry_host }}:{{ registry_port }}/openshift-kni/ztp-site-generator:{{ ztp_site_generator_image_tag }} --keep-manifest-list --continue-on-error=true

