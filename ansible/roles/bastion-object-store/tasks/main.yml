---
# bastion-object-store tasks — deploys RustFS (S3-compatible object store)

- name: Create directory for bastion object store storage
  ansible.builtin.file:
    path: "{{ object_store_path }}"
    state: directory

- name: Set object store data disk partition path
  ansible.builtin.set_fact:
    _object_store_disk_partition: "{{ object_store_data_disk }}1"
  when: object_store_data_disk != ""

- name: Set object store data disk partition path for nvme
  ansible.builtin.set_fact:
    _object_store_disk_partition: "{{ object_store_data_disk }}p1"
  when:
  - object_store_data_disk != ""
  - '"nvme" in object_store_data_disk'
  - '"by-path" not in object_store_data_disk'

- name: Set object store data disk partition path for by-path
  ansible.builtin.set_fact:
    _object_store_disk_partition: "{{ object_store_data_disk }}-part1"
  when:
  - object_store_data_disk != ""
  - '"by-path" in object_store_data_disk'

- name: Create object store data disk primary partition
  community.general.parted:
    device: "{{ object_store_data_disk }}"
    number: 1
    state: present
    label: gpt
  when: object_store_data_disk != ""

- name: Format object store data disk as XFS
  community.general.filesystem:
    fstype: xfs
    dev: "{{ _object_store_disk_partition }}"
  when: object_store_data_disk != ""

- name: Mount object store data disk
  ansible.posix.mount:
    fstype: xfs
    src: "{{ _object_store_disk_partition }}"
    path: "{{ object_store_path }}"
    state: mounted
  when: object_store_data_disk != ""

- name: Create object store data directory
  ansible.builtin.file:
    path: "{{ object_store_path }}/data"
    state: directory

# RustFS runs as non-root user (UID 10001). Ensure the data directory is
# writable by the container process.
- name: Set ownership of data directory for RustFS container user
  ansible.builtin.file:
    path: "{{ object_store_path }}/data"
    owner: "10001"
    group: "10001"
    recurse: true

- name: Create object-store pod
  containers.podman.podman_pod:
    name: object-store
    network: host
    state: started

# On a reboot "started" state does not start an exited pod (why..idk)
- name: Ensure object-store pod is up
  containers.podman.podman_pod:
    name: object-store
    network: host
    state: restarted

- name: Create RustFS container in object-store pod
  containers.podman.podman_container:
    pod: object-store
    network: host
    name: object-store
    image: "{{ object_store_image }}:{{ object_store_image_tag }}"
    entrypoint: /bin/sh
    command:
    - -c
    - "mkdir -p /storage/thanos && mkdir -p /storage/dr4hub/velero && for i in $(seq -f \"%05g\" 1 4000); do mkdir -p \"/storage/vm$i-ibu\"; done && rustfs server /storage --console-address :{{ object_store_console_port }}"
    env:
      RUSTFS_ACCESS_KEY: "{{ object_store_access_key }}"
      RUSTFS_SECRET_KEY: "{{ object_store_secret_key }}"
    volume:
    - "{{ object_store_path }}/data:/storage:Z"
    state: started

- name: Wait for RustFS S3 API to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ object_store_port }}/minio/health/live"
    method: GET
    status_code: 200
  register: _rustfs_health
  until: _rustfs_health.status == 200
  retries: 30
  delay: 2
