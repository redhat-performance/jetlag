---
# Temporary DNS validation tasks - verify A and AAAA responses for *.apps ingress
# These tasks confirm the NODATA fix is working correctly and should be removed
# once the fix is validated.

- name: Validate DNS responses for *.apps ingress
  block:
    - name: Set bastion DNS server address
      ansible.builtin.set_fact:
        bastion_controlplane_ip: "{{ controlplane_network[0] | ansible.utils.nthhost(1) }}"

    # MNO/VMNO cluster validation
    - name: "Validate DNS A record for *.apps.{{ cluster_name }}"
      ansible.builtin.command: >-
        dig A console-openshift-console.apps.{{ cluster_name }}.{{ base_dns_name }}
        @{{ bastion_controlplane_ip }} +noall +answer +comments
      register: dns_a_result
      changed_when: false
      when: cluster_type in ["mno", "vmno"]

    - name: Display A record result
      ansible.builtin.debug:
        var: dns_a_result.stdout_lines
      when: dns_a_result is not skipped

    - name: "Validate DNS AAAA record for *.apps.{{ cluster_name }}"
      ansible.builtin.command: >-
        dig AAAA console-openshift-console.apps.{{ cluster_name }}.{{ base_dns_name }}
        @{{ bastion_controlplane_ip }} +noall +answer +comments
      register: dns_aaaa_result
      changed_when: false
      when: cluster_type in ["mno", "vmno"]

    - name: Display AAAA record result
      ansible.builtin.debug:
        var: dns_aaaa_result.stdout_lines
      when: dns_aaaa_result is not skipped

    # SNO cluster validation
    - name: "Validate DNS A record for *.apps SNO hosts"
      ansible.builtin.command: >-
        dig A console-openshift-console.apps.{{ item }}.{{ base_dns_name }}
        @{{ bastion_controlplane_ip }} +noall +answer +comments
      register: sno_dns_a_result
      changed_when: false
      loop: "{{ groups['sno'] }}"
      when: groups['sno'] is defined

    - name: Display SNO A record results
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.stdout_lines }}"
      loop: "{{ sno_dns_a_result.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: sno_dns_a_result is not skipped and sno_dns_a_result.results is defined

    - name: "Validate DNS AAAA record for *.apps SNO hosts"
      ansible.builtin.command: >-
        dig AAAA console-openshift-console.apps.{{ item }}.{{ base_dns_name }}
        @{{ bastion_controlplane_ip }} +noall +answer +comments
      register: sno_dns_aaaa_result
      changed_when: false
      loop: "{{ groups['sno'] }}"
      when: groups['sno'] is defined

    - name: Display SNO AAAA record results
      ansible.builtin.debug:
        msg: "{{ item.item }}: {{ item.stdout_lines }}"
      loop: "{{ sno_dns_aaaa_result.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: sno_dns_aaaa_result is not skipped and sno_dns_aaaa_result.results is defined

  ignore_errors: true
