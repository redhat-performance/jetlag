---
# bastion-minio default vars
#
# Note: Variable names retain the "minio_" prefix for backward compatibility
# with existing user overrides in ansible/vars/all.yml. The underlying object
# store has been migrated from the archived MinIO project to RustFS, a drop-in
# S3-compatible replacement (https://rustfs.com).

# TODO: Temporarily defaulting to true for initial RustFS validation testing.
# Revert to false once migration is confirmed working.
setup_bastion_object_store: true

minio_store_path: /opt/jetlag/minio
minio_image: quay.io/rustfs/rustfs
minio_image_tag: 1.0.0-rc.6
minio_access_key: minio
minio_secret_key: minio123
minio_port: 9000
minio_console_port: 9001
# Set to a full device path (e.g. /dev/sdb, /dev/nvme0n1,
# /dev/disk/by-path/pci-0000:18:00.0-scsi-0:2:1:0) to partition, format as XFS,
# and mount it at minio_store_path/data. Empty string disables separate disk setup.
minio_data_disk: ""
