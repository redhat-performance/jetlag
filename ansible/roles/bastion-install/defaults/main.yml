---
# bastion-install default vars

coredns_url: https://github.com/coredns/coredns/releases/download/v1.10.1/coredns_1.10.1_linux_amd64.tgz
grpcurl_url: https://github.com/fullstorydev/grpcurl/releases/download/v1.8.1/grpcurl_1.8.1_linux_x86_64.tar.gz
kubeburner_url: https://github.com/kube-burner/kube-burner/releases/download/v2.1.1/kube-burner-V2.1.1-linux-x86_64.tar.gz
kubeburner_ocp_url: https://github.com/kube-burner/kube-burner-ocp/releases/download/v1.9.1/kube-burner-ocp-V1.9.1-linux-x86_64.tar.gz
object_store_client_url: https://github.com/rustfs/cli/releases/download/v0.1.35/rustfs-cli-linux-amd64-v0.1.35.tar.gz
yq_url: https://github.com/mikefarah/yq/releases/download/v4.40.3/yq_linux_amd64.tar.gz

# Crucible specific vars
install_rh_crucible: false
rh_crucible_url: https://github.com/perftool-incubator/crucible

# Since the use of tc on the bastion machine is rare, we disable rebooting the bastion machine by default
bastion_install_tc_reboot: false

# Reset iDRAC service using badfish container (pulls and uses badfish container
# to clear job queue and reset iDRAC service)
reset_idrac: false
