---
# Dell tasks for resetting iDRAC (fire resets for all hosts, then wait separately)

- name: "Dell - Reset iDRAC for {{ item }} (racadm over SSH)"
  ansible.builtin.shell: >-
    sshpass -p "{{ hostvars[item]['bmc_password'] }}"
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
    {{ hostvars[item]['bmc_user'] }}@{{ hostvars[item]['bmc_address'] }}
    racadm racreset
  ignore_errors: true
